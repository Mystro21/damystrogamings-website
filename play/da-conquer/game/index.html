<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Da Conquer browser game</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102a23;color:#f4ead1;font:16px system-ui}
canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#102a23;padding:24px}progress{width:min(75vw,400px);margin:20px auto}a{color:#e9c777}p{max-width:600px}
</style></head><body><canvas id="unity-canvas" tabindex="0" aria-label="Da Conquer game"></canvas>
<div id="loading" role="status"><h1>Da Conquer</h1><div id="status">Downloading game…</div><progress id="progress" max="100" value="0"></progress><p>The first download is about 178 MB. Please keep this tab open.</p></div>
<script>
const canvas=document.getElementById('unity-canvas'),status=document.getElementById('status'),bar=document.getElementById('progress');
const config={"dataUrl": "", "frameworkUrl": "Build/WebGL.framework.js.unityweb", "codeUrl": "Build/WebGL.wasm.unityweb", "streamingAssetsUrl": "StreamingAssets", "companyName": "Da Mystro Gamings LLC", "productName": "Da Conquer", "productVersion": "1.1.7-web-2026-10-24", "matchWebGLToCanvasSize": true, "autoSyncPersistentDataPath": true};
canvas.addEventListener('pointerdown',()=>canvas.focus());
async function start(){
  if(!window.DecompressionStream)throw new Error('Please use a current version of Chrome, Edge, Firefox or Safari to load this browser test.');
  const manifestResponse=await fetch('data-manifest.json');if(!manifestResponse.ok)throw new Error('The game manifest could not be loaded.');
  const manifest=await manifestResponse.json(),chunks=new Array(manifest.parts.length);let next=0,received=0;
  async function worker(){while(next<manifest.parts.length){const i=next++,part=manifest.parts[i],response=await fetch(part.url);if(!response.ok)throw new Error('A game download failed. Please reload to try again.');const bytes=await response.arrayBuffer();if(bytes.byteLength!==part.bytes)throw new Error('A game download was incomplete.');const hash=await crypto.subtle.digest('SHA-256',bytes);const hex=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');if(hex!==part.sha256)throw new Error('A game download failed its integrity check.');chunks[i]=bytes;received+=bytes.byteLength;bar.value=received/manifest.bytes*75;status.textContent='Downloading game: '+Math.round(received/manifest.bytes*100)+'%';}}
  await Promise.all([worker(),worker(),worker()]);status.textContent='Preparing game…';
  const compressed=new Blob(chunks);chunks.fill(null);
  const raw=await new Response(compressed.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
  config.dataUrl=URL.createObjectURL(raw);
  await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='Build/WebGL.loader.js';script.onload=resolve;script.onerror=()=>reject(new Error('The game loader could not be downloaded.'));document.body.append(script);});
  await createUnityInstance(canvas,config,p=>{bar.value=75+p*25;status.textContent='Starting game: '+Math.round(p*100)+'%';});
  URL.revokeObjectURL(config.dataUrl);document.getElementById('loading').remove();canvas.focus();
}
start().catch(error=>{console.error(error);status.textContent=String(error.message||error);bar.remove();const a=document.createElement('a');a.href=location.href;a.textContent='Reload game';document.getElementById('loading').append(a);});
</script></body></html>
